services:
  back-end:
    build:
      dockerfile: ./Dockerfile
      context: ./
    env_file:
      - .env
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: uv.lock

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgresql:
    image: postgres:alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery-worker:
    build: .
    command: uv run celery -A app.core.celery worker --loglevel=info -P solo
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    env_file:
      - .env

  celery-beat:
    build: .
    command: uv run celery -A app.core.celery beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    env_file:
      - .env

volumes:
  redis-data:
  postgres-data:
